<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartTools 账户安全</title><link rel="stylesheet" href="/shared/account-maintenance.css"></head><body><main><h1>账户安全维护</h1><p>仅管理账户；书签请使用栖页扩展。</p><p id="status" role="status"></p><form id="login"><label>管理员账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><section id="security" hidden><p id="source"></p><form id="password"><label>当前密码<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>新密码<input name="newPassword" type="password" autocomplete="new-password" required></label><button>修改密码并退出所有设备</button></form><button id="revoke">注销全部设备</button><button id="logout">退出当前会话</button></section><details id="recovery" hidden><summary>临时一次性恢复</summary><form id="recover"><label>恢复令牌<input name="recoveryToken" type="password" autocomplete="off" required></label><label>新密码<input name="newPassword" type="password" autocomplete="new-password" required></label><button>重设密码</button></form><p>恢复成功后请删除服务器临时恢复变量。令牌不存储、不放入 URL。</p></details></main><script type="module" src="/shared/account-maintenance.js"></script></body></html>
