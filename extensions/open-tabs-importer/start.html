<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>栖页 · 书签桌面</title><link rel="stylesheet" href="start.css"><link rel="stylesheet" href="account.css"></head>
<body>
<aside id="sidebar" class="desktop-sidebar" aria-label="书签分类"><a class="brand" href="start.html" aria-label="栖页主页">栖<span></span></a><nav id="groups" aria-label="分组"></nav><button id="addGroup" class="nav-add" aria-label="新建分组" title="新建分组" data-icon="plus"></button></aside>
<div class="start-shell">
<header class="topbar"><button id="openSidebar" class="icon-button mobile-nav" aria-label="选择分类" aria-expanded="false" data-icon="menu"></button><span class="app-name">栖页 <span>/ 书签桌面</span></span><div class="tools"><button id="refresh" class="icon-button" aria-label="刷新云端数据" title="刷新云端数据" data-icon="refresh"></button><div id="accountHost"></div></div></header>
<section class="desktop-hero" aria-label="时间与搜索"><div class="clock-block"><time id="clock"></time><time id="date"></time></div><div class="start-search"><span data-icon="search"></span><input id="search" type="search" placeholder="搜索你的书签" aria-label="搜索书签" autocomplete="off"><kbd>/</kbd></div></section>
<main id="desktop" class="desktop"><div class="desktop-heading"><div><h1 id="groupTitle"></h1><span id="groupInfo"></span></div><button id="groupMore" class="icon-button" aria-label="分组操作" data-icon="more"></button></div><div id="cards" class="desktop-grid" aria-label="书签"></div></main>
<p id="status" role="status" aria-live="polite"></p><footer><span id="summary"></span><nav><a id="website" target="_blank" rel="noopener noreferrer">网站首页 ↗</a> · <a id="backend" target="_blank" rel="noopener noreferrer">完整后台 ↗</a></nav><span>只留常用，轻松找到。</span></footer>
</div>
<div id="draftBar" class="draft-bar" hidden><div><strong>未保存修改</strong><small>仅在当前页面</small></div><button id="discard">放弃修改</button><button id="save" class="primary">保存到云端</button></div>
<div id="folderBackdrop" class="folder-backdrop" hidden><section id="folderPanel" class="folder-panel" role="dialog" aria-modal="true" aria-label="文件夹" tabindex="-1"><header><div><p id="folderPath"></p><h2 id="folderTitle"></h2></div><button id="closeFolder" class="icon-button" aria-label="关闭文件夹" data-icon="close"></button></header><div id="folderTools"></div><div id="folderCards" class="desktop-grid"></div><p class="folder-hint">可拖动排列 · 拖出文件夹移到桌面</p></section></div>
<div id="contextMenu" class="context-menu" role="menu" hidden></div>
<dialog id="editor"><form id="editForm"><header><div><small>整理书签</small><h2 id="editTitle"></h2></div><button id="cancelEdit" type="button" class="icon-button" aria-label="关闭编辑" data-icon="close"></button></header><p id="editorContext"></p><div id="fields"></div><p id="editorError" role="alert"></p><div class="dialog-actions"><span>不会立即修改云端</span><button class="primary" type="submit">应用到草稿</button></div></form></dialog>
<script type="module" src="start.js"></script></body></html>
