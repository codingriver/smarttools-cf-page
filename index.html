    <script>
    (function () {
        var patched = false;

        function patchLink(a) {
            if (!a || !a.getAttribute) return;
            var href = a.getAttribute('href') || '';
            try {
                var u = new URL(href, location.href);
                if (u.protocol !== 'http:' && u.protocol !== 'https:') return;
            } catch (e) {
                return;
            }
            if (a.getAttribute('referrerpolicy') !== 'origin') {
                a.setAttribute('referrerpolicy', 'origin');
            }
            var rel = a.getAttribute('rel') || '';
            if (/\bnoreferrer\b/i.test(rel)) {
                rel = rel.split(/\s+/).filter(function (v) {
                    return v && v.toLowerCase() !== 'noreferrer';
                }).join(' ');
                if (rel) a.setAttribute('rel', rel);
                else a.removeAttribute('rel');
            }
        }

        function patchAll() {
            if (patched) return;
            patched = true;
            document.querySelectorAll('a[href]').forEach(patchLink);
        }

        document.addEventListener('DOMContentLoaded', patchAll, { once: true });
        document.addEventListener('pointerdown', function (e) {
            var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
            patchLink(a);
        }, true);
        document.addEventListener('click', function (e) {
            var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
            patchLink(a);
        }, true);
    })();
    </script>

    <!-- 尽早并行请求公开数据；在线响应同时注入站点配置和查看者身份。 -->
    <script>
    (function () {
        var PUBLIC_DATA_CACHE_KEY = 'smarttools:public-data-cache:v1';
        var PUBLIC_DATA_CACHE_TTL_MS = 1095 * 24 * 60 * 60 * 1000;

        function appendScript(src) {
            return new Promise(function(resolve, reject) {
                var script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = function() { reject(new Error('script load failed: ' + src)); };
                document.head.appendChild(script);
            });
        }

        function runScript(text, sourceURL) {
            var script = document.createElement('script');
            script.text = String(text || '') + '\n//# sourceURL=' + (sourceURL || 'smarttools-data.js');
            document.head.appendChild(script);
        }

        function isPublicDataScript(text) {
            if (!text) return false;
            return /window\.__viewerInfo\s*=\s*\{[^;]*?["']?isAdminView["']?\s*:\s*false/.test(String(text)) &&
                !/window\.__viewerInfo\s*=\s*\{[^;]*?["']?isAdminView["']?\s*:\s*true/.test(String(text));
        }

        function writePublicDataCache(text, etag) {
            if (!isPublicDataScript(text)) return;
            try {
                var savedAt = Date.now();
                localStorage.setItem(PUBLIC_DATA_CACHE_KEY, JSON.stringify({
                    savedAt: savedAt,
                    expiresAt: savedAt + PUBLIC_DATA_CACHE_TTL_MS,
                    etag: etag || '',
                    content: String(text || '')
                }));
            } catch (e) {}
        }

        function readPublicDataCache() {
            try {
                var raw = localStorage.getItem(PUBLIC_DATA_CACHE_KEY);
                if (!raw) return null;
                var cached = JSON.parse(raw);
                if (!cached || typeof cached.content !== 'string' || !isPublicDataScript(cached.content)) {
                    localStorage.removeItem(PUBLIC_DATA_CACHE_KEY);
                    return null;
                }
                if (cached.expiresAt && cached.expiresAt < Date.now()) {
                    localStorage.removeItem(PUBLIC_DATA_CACHE_KEY);
                    return null;
                }
                return cached;
            } catch (e) {
                try { localStorage.removeItem(PUBLIC_DATA_CACHE_KEY); } catch (_) {}
                return null;
            }
        }

        function extendPublicDataCache(etag) {
            var cached = readPublicDataCache();
            if (!cached) return;
            cached.savedAt = Date.now();
            cached.expiresAt = cached.savedAt + PUBLIC_DATA_CACHE_TTL_MS;
            if (etag) cached.etag = etag;
            try {
                localStorage.setItem(PUBLIC_DATA_CACHE_KEY, JSON.stringify(cached));
            } catch (e) {}
        }

        async function refreshData(etag) {
            try {
                var response = await fetch('/api/data', {
                    credentials: 'include',
                    cache: 'default',
                    headers: etag ? { 'If-None-Match': etag } : {}
                });
                if (response.status === 304) {
                    extendPublicDataCache(etag);
                    return { updated: false, status: 304 };
                }
                if (!response.ok) throw new Error('/api/data failed: ' + response.status);
                var nextEtag = response.headers.get('ETag') || '';
                var text = await response.text();
                if (etag && nextEtag && etag === nextEtag) {
                    if (response.headers.get('X-Private-Filtered') === '1') {
                        writePublicDataCache(text, nextEtag);
                    }
                    return { updated: false, status: 200 };
                }
                runScript(text, '/api/data');
                if (response.headers.get('X-Private-Filtered') === '1') {
                    writePublicDataCache(text, nextEtag);
                }
                if (typeof window.__favPageReloadData === 'function') {
                    window.__favPageReloadData();
                }
                return { updated: true, status: 200 };
            } catch (error) {
                console.warn('data refresh failed:', error && error.message);
                return { updated: false, error: error && error.message };
            }
        }

        async function loadData() {
            if (location.protocol === 'file:') {
                await appendScript('data.js');
                return;
            }
            var inlineScript = document.querySelector('script[data-inline-data]');
            if (inlineScript) {
                writePublicDataCache(inlineScript.text || inlineScript.textContent || '', inlineScript.getAttribute('data-etag') || '');
                window.__SmartToolsDataRefresh = refreshData(inlineScript.getAttribute('data-etag') || '');
                return;
            }
            var cached = readPublicDataCache();
            if (cached) {
                runScript(cached.content, 'smarttools-public-data-cache.js');
                window.__SmartToolsDataRefresh = refreshData(cached.etag || '');
                return;
            }
            try {
                var response = await fetch('/api/data', { credentials: 'include', cache: 'default' });
                if (!response.ok) throw new Error('/api/data failed: ' + response.status);
                var text = await response.text();
                runScript(text, '/api/data');
                if (response.headers.get('X-Private-Filtered') === '1') {
                    writePublicDataCache(text, response.headers.get('ETag') || '');
                }
            } catch (error) {
                console.warn('online data load failed, fallback to data.js:', error && error.message);
                await appendScript('data.js');
            }
        }

        window.__SmartToolsDataReady = loadData();
    })();
    </script>

.link-card,
.sub-card,

.ripple {

    pointer-events: none;
    background-color: #6E56CF;

.sub-card,
.back-link,

    --ac-hov:          #0F5F52;

    --sh-lg:  0 12px 24px rgba(18,63,54,.10),
